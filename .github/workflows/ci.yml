
name: CI - StockFlow React

on:
  push:
    branches:
      - main
      - feature/ai-cloud
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validacion y compilacion React
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Verificar configuracion publica
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"

      - name: Validar ESLint
        working-directory: app
        run: npm run lint

      - name: Validar TypeScript
        working-directory: app
        run: npm run check

      - name: Compilar React
        working-directory: app
        run: npm run build

      - name: Verificar archivos generados
        run: |
          test -f dist/index.html
          test -f dist/app/index.html

      - name: Registrar commit del build
        run: echo "$GITHUB_SHA" > dist/version.txt

      - name: Guardar artefacto dist
        uses: actions/upload-artifact@v4
        with:
          name: stockflow-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30
