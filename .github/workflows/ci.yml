
name: CI/CD - StockFlow React

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ESLint y compilacion React
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Validar ESLint
        working-directory: app
        run: npm run lint

      - name: Compilar React
        working-directory: app
        run: npm run build

      - name: Verificar archivos generados
        run: test -f dist/index.html

      - name: Guardar artefacto dist
        uses: actions/upload-artifact@v4
        with:
          name: stockflow-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Desplegar en Amazon S3
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: stockflow-dist
          path: dist/

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verificar identidad AWS
        run: aws sts get-caller-identity

      - name: Publicar en S3
        env:
          BUCKET: ${{ vars.S3_BUCKET_NAME }}
        run: aws s3 sync dist/ "s3://$BUCKET/" --delete
