
name: CI - StockFlow React

on:
  push:
    branches:
      - main
      - 'test/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Instalar y compilar React
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/pacsage-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Compilar frontend
        working-directory: app
        run: npm run build

      - name: Verificar archivos generados
        run: |
          test -f dist/index.html
          echo "Compilación de StockFlow exitosa"
